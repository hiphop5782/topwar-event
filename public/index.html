<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>기지 날아간 위치 맞추기</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div>
          <p class="eyebrow">3223 서버 수도장 포상 이벤트</p>
          <h1>기지 날아간 위치 맞추기</h1>
        </div>
        <div class="role-badge" aria-label="현재 화면 모드">
          <span id="roleBadgeText">사용자</span>
        </div>
      </header>

      <section class="status-strip" aria-live="polite">
        <div>
          <span class="label">상태</span>
          <strong id="phaseText">준비 중</strong>
        </div>
        <div>
          <span class="label">선택 수</span>
          <strong><span id="pickLimitText">3</span>개</strong>
        </div>
        <div>
          <span class="label">참여자</span>
          <strong><span id="participantCount">0</span>명</strong>
        </div>
      </section>

      <section id="winnerBanner" class="winner-banner" hidden>
        <div>
          <span>당첨 칸</span>
          <strong id="winnerCellText">-</strong>
        </div>
        <p id="winnerNamesText">당첨자가 없습니다.</p>
      </section>

      <section class="layout">
        <div class="board-wrap">
          <div id="board" class="board" aria-label="8x8 선택 보드"></div>
        </div>

        <aside class="panel user-panel" data-panel="user">
          <h2>사용자 선택</h2>
          <label>
            이름
            <input id="nameInput" autocomplete="name" placeholder="이름을 입력하세요" />
          </label>
          <div>
            <div class="panel-row">
              <span>내 선택</span>
              <strong><span id="myPickCount">0</span>/<span id="myPickLimit">3</span></strong>
            </div>
            <div id="myPicks" class="chips"></div>
          </div>
          <button id="submitPicks" class="primary">선택 저장</button>
          <p id="userMessage" class="message"></p>
        </aside>

        <aside class="panel admin-panel" data-panel="admin">
          <h2>관리자 설정</h2>
          <label>
            사용자당 선택 개수
            <input id="pickLimitInput" type="number" min="1" max="64" value="3" />
          </label>
          <label>
            보드 이미지 URL
            <input id="boardImageInput" placeholder="map.png 또는 https://..." />
          </label>
          <button id="applySettings" class="primary">설정 적용</button>
          <button id="forbiddenModeToggle" class="mode-toggle">선택 금지 칸 편집</button>
          <div class="button-grid">
            <button id="openVoting">선택 시작</button>
            <button id="lockVoting">선택 마감</button>
          </div>
          <button id="resetAll" class="danger">모든 내역 초기화</button>
          <p id="adminMessage" class="message">관리자는 보드 칸을 눌러 당첨 칸을 발표할 수 있습니다.</p>
        </aside>
      </section>

      <section class="participants">
        <div class="section-title">
          <h2>참여 현황</h2>
          <span id="selectedCellsSummary">아직 선택된 칸이 없습니다.</span>
        </div>
        <div id="participantsList" class="participant-list"></div>
      </section>

      <section class="history">
        <div class="section-title">
          <h2>당첨 내역</h2>
          <span id="historySummary">아직 발표 기록이 없습니다.</span>
        </div>
        <div id="historyList"></div>
      </section>
    </main>

    <script src="./app.js" type="module"></script>
  </body>
</html>
