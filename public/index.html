<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>기지 날아간 위치 맞추기</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./styles.css?v=20260618-6" />
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div>
          <p class="eyebrow" data-i18n>3223 서버 수도장 포상 이벤트</p>
          <h1 data-i18n>기지 날아간 위치 맞추기</h1>
        </div>
        <div class="header-actions">
          <a class="nav-link" href="./ox-quiz/index.html">OX 퀴즈</a>
          <nav id="languageSwitcher" class="language-switcher" aria-label="언어 선택" data-no-translate></nav>
          <div class="role-badge" aria-label="현재 화면 모드">
            <span id="roleBadgeText">사용자</span>
          </div>
        </div>
      </header>

      <section class="status-strip" aria-live="polite">
        <div>
          <span class="label" data-i18n>상태</span>
          <strong id="phaseText" data-i18n>준비 중</strong>
        </div>
        <div>
          <span class="label" data-i18n>선택 수</span>
          <strong><span id="pickLimitText">3</span><span data-i18n>개</span></strong>
        </div>
        <div>
          <span class="label" data-i18n>참여자</span>
          <strong><span id="participantCount">0</span><span data-i18n>명</span></strong>
        </div>
      </section>

      <section id="winnerBanner" class="winner-banner" hidden>
        <div>
          <span data-i18n>당첨 칸</span>
          <strong id="winnerCellText">-</strong>
        </div>
        <p id="winnerNamesText" data-i18n>당첨자가 없습니다.</p>
      </section>

      <section class="layout">
        <div class="board-wrap">
          <div id="board" class="board" aria-label="8x8 선택 보드"></div>
          <section id="winnerRoster" class="winner-roster" hidden>
            <div class="section-title">
              <h2 data-i18n>당첨 인원</h2>
              <span id="winnerRosterSummary" data-i18n>아직 당첨 인원이 없습니다.</span>
            </div>
            <div id="winnerRosterList"></div>
          </section>
        </div>

        <aside class="panel user-panel" data-panel="user">
          <h2 data-i18n>사용자 선택</h2>
          <label>
            <span data-i18n>이름</span>
            <input id="nameInput" autocomplete="name" placeholder="이름을 입력하세요" data-i18n-placeholder />
          </label>
          <div>
            <div class="panel-row">
              <span data-i18n>내 선택</span>
              <strong><span id="myPickCount">0</span>/<span id="myPickLimit">3</span></strong>
            </div>
            <div id="myPicks" class="chips"></div>
          </div>
          <button id="submitPicks" class="primary" data-i18n>선택 저장</button>
          <p id="userMessage" class="message"></p>
        </aside>

        <aside class="panel admin-panel" data-panel="admin">
          <h2 data-i18n>관리자 설정</h2>
          <label>
            <span data-i18n>사용자당 선택 개수</span>
            <input id="pickLimitInput" type="number" min="1" max="64" value="3" />
          </label>
          <label>
            <span data-i18n>당첨 인원</span>
            <input id="winnerLimitInput" type="number" min="1" max="64" value="1" />
          </label>
          <label class="checkbox-row">
            <input id="allowDuplicateWinnersInput" type="checkbox" checked />
            <span data-i18n>중복 당첨 허용</span>
          </label>
          <button id="applySettings" class="primary" data-i18n>설정 적용</button>
          <button id="forbiddenModeToggle" class="mode-toggle" data-i18n>선택 금지 칸 편집</button>
          <div class="button-grid">
            <button id="openVoting" data-i18n>선택 시작</button>
            <button id="lockVoting" data-i18n>선택 마감</button>
          </div>
          <button id="resetPicksOnly" data-i18n>선택만 초기화</button>
          <button id="resetWinnerHistory" data-i18n>당첨 내역만 초기화</button>
          <button id="resetAll" class="danger" data-i18n>모든 내역 초기화</button>
          <p id="adminMessage" class="message" data-i18n>관리자는 보드 칸을 눌러 당첨 칸을 발표할 수 있습니다.</p>
        </aside>
      </section>

      <section class="participants">
        <div class="section-title">
          <h2 data-i18n>참여 현황</h2>
          <span id="selectedCellsSummary" data-i18n>아직 선택된 칸이 없습니다.</span>
        </div>
        <div id="participantsList" class="participant-list"></div>
      </section>

      <section class="history">
        <div class="section-title">
          <h2 data-i18n>당첨 내역</h2>
          <span id="historySummary" data-i18n>아직 발표 기록이 없습니다.</span>
        </div>
        <div id="historyList"></div>
      </section>
      <div id="toastRoot" class="toast-root" aria-live="assertive" aria-atomic="true"></div>
    </main>

    <script src="./app.js?v=20260618-8" type="module"></script>
  </body>
</html>
